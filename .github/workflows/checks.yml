name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (Liquid sections, board email reader)
        run: npm test
      - name: Bundled Supabase library matches the pinned npm package
        run: npm run check-vendor
      - name: Shopify theme check
        run: npm run theme-check
      - name: dist/ matches preview/ and assets/
        run: |
          npm run build
          git diff --exit-code --stat -- dist || { echo "::error::dist/ is stale. Run 'npm run build' and commit the result."; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all -- dist)" || { echo "::error::dist/ has untracked files. Run 'npm run build' and commit the result."; git status --porcelain -- dist; exit 1; }
