name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  theme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Liquid section tests
        run: npm test
      - name: Shopify theme check
        run: npm run theme-check
      - name: dist/ matches preview/ and assets/
        run: |
          npm run build
          git diff --exit-code --stat -- dist || { echo "::error::dist/ is stale. Run 'npm run build' and commit the result."; exit 1; }
          test -z "$(git status --porcelain --untracked-files=all -- dist)" || { echo "::error::dist/ has untracked files. Run 'npm run build' and commit the result."; git status --porcelain -- dist; exit 1; }
